services:
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [db, redis]
    volumes: ["./backend:/srv"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: allen
      POSTGRES_PASSWORD: allen
      POSTGRES_DB: allen
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
volumes:
  pgdata:
