name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter (stable)
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Generate Android project files
        working-directory: app
        run: |
          flutter --version
          flutter create --org com.allen --project-name allen_ai --platforms android .
          # keep our manifest, Kotlin code and resources (flutter create may overwrite them)
          git checkout -- android/app/src/main
          ../scripts/patch_android_build.sh
          rm -f test/widget_test.dart   # default sample test from flutter create
          flutter pub get
          flutter gen-l10n

      - name: Unit tests (parser)
        working-directory: app
        continue-on-error: true
        run: flutter test

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: allen-ai-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

      # Stable download link for the phone: Releases > latest-apk
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-debug.apk allen-ai-debug.apk
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk allen-ai-debug.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "ALLEN AI debug APK (latest)" \
            --notes "Debug build of commit ${{ github.sha }}. Install on Android, then enable ALLEN AI in Settings > Accessibility."
