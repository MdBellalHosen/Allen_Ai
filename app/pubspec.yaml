name: allen_ai
description: ALLEN AI — voice-controlled phone agent (Android).
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^14.0.0
  shared_preferences: ^2.2.0
  permission_handler: ^11.3.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.0
  record: ^6.0.0
  http: ^1.2.0
  path_provider: ^2.1.0
  porcupine_flutter: ^3.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/wakeword/
